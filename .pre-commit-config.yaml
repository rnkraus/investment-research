minimum_pre_commit_version: "4.6.2"

repos:
  - repo: local
    hooks:
      - id: backend-verification
        name: Backend verification
        entry: uv run --directory backend --locked python -m scripts.verify_backend
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|uv\.lock|.*\.py)$

      - id: api-contract
        name: FastAPI OpenAPI contract
        entry: uv run --directory backend --locked python -m scripts.export_openapi --check
        language: system
        pass_filenames: false
        files: ^(backend/(pyproject\.toml|uv\.lock|src/.*\.py|scripts/export_openapi\.py)|frontend/src/lib/api/generated/(openapi\.json|schema\.d\.ts))$

      - id: frontend-format
        name: Frontend formatting
        entry: pnpm format
        language: system
        pass_filenames: false
        files: ^(frontend/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$)

      - id: frontend-lint
        name: Frontend lint
        entry: pnpm lint
        language: system
        pass_filenames: false
        files: ^(frontend/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$)

      - id: frontend-typecheck
        name: Frontend type-check
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        files: ^(frontend/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$)
