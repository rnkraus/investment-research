[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "investment-research"
version = "0.0.0"
description = "Evidence-grounded investment research archive"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.19,<2",
  "boto3>=1.43.89,<2",
  "botocore>=1.43.89,<1.44",
  "celery[redis]>=5.6.3,<5.7",
  "fastapi>=0.116,<1",
  "openai==3.14.1",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "pinecone==10.0.0",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.11,<3",
  "pypdf>=6.21.2,<7",
  "python-dotenv>=1.2.3,<2",
  "python-multipart>=0.0.32,<0.1",
  "redis>=6.4,<6.5",
  "sqlalchemy>=2.0.44,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=2.3,<3",
  "pre-commit>=4.6.2,<5",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
required-version = ">=0.12.7,<0.13"
exclude-newer = "7 days"
exclude-newer-package = { openai = "2026-09-16T00:00:00Z" }

[tool.uv.audit]
malware-check = true

[tool.hatch.build.targets.wheel]
packages = ["src/investment_research"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
