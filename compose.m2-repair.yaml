# Explicit opt-in while M2 Step 1 normal capture activation remains pending.
services:
  redis:
    networks:
      - backend
      - repair

  scheduler:
    image: investment-research-backend-worker:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    entrypoint:
      - /app/.venv/bin/python
      - -m
      - investment_research.scheduler
    command: []
    user: "65532:65532"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      disable: true
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: development
      INVESTMENT_RESEARCH_RUNTIME_LOCATION: container
      INVESTMENT_RESEARCH_LOG_LEVEL: INFO
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - redis_password
    networks:
      - repair
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

networks:
  repair:
    internal: true
