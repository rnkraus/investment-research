name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          install: false
          cache: false
          require-lockfile: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install backend development dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Validate pre-commit configuration
        run: uv run --project backend --locked pre-commit validate-config

      - name: Run pre-commit hooks on all files
        run: uv run --project backend --locked pre-commit run --all-files --show-diff-on-failure

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          install: false
          cache: false
          require-lockfile: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check frontend Dockerfile
        run: docker buildx build --check --file frontend/Dockerfile .

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify deterministic backend checks
        run: uv run --locked python -m scripts.verify_backend

      - name: Check FastAPI OpenAPI contract
        run: uv run --locked python -m scripts.export_openapi --check

      - name: Verify isolated PostgreSQL persistence and migrations
        run: uv run --locked python -m scripts.verify_postgres

  backend-images:
    name: Backend images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Check backend Dockerfile
        run: docker buildx build --check --file Dockerfile .

      - name: Validate normal Docker Compose configuration
        working-directory: .
        env:
          COMPOSE_DISABLE_ENV_FILE: "1"
          INVESTMENT_RESEARCH_S3_ACCESS_KEY_ID: ci-validation-app-access
          INVESTMENT_RESEARCH_S3_BUCKET: ci-validation-storage
          INVESTMENT_RESEARCH_S3_SECRET_ACCESS_KEY: ci-validation-app-secret
          POSTGRES_DB: investment_research
          POSTGRES_PASSWORD: ci-compose-validation-only
          POSTGRES_USER: investment_research
          SEAWEEDFS_ADMIN_ACCESS_KEY: ci-validation-admin-access
          SEAWEEDFS_ADMIN_SECRET_ACCESS_KEY: ci-validation-admin-secret
        run: docker compose --file compose.yaml config --quiet

      - name: Validate provider-backed M1 Docker Compose override
        working-directory: .
        env:
          COMPOSE_DISABLE_ENV_FILE: "1"
          INVESTMENT_RESEARCH_PROVIDER_MONTHLY_BUDGET_MICRO_USD: "5000000"
          INVESTMENT_RESEARCH_PINECONE_INDEX_HOST: ci-index.example.svc.pinecone.io
          INVESTMENT_RESEARCH_S3_BUCKET: ci-validation-storage
          POSTGRES_DB: investment_research
          POSTGRES_USER: investment_research
        run: |
          docker compose --file compose.yaml --file compose.m1-live.yaml config --quiet
          docker compose --file compose.yaml --file compose.m1-live.yaml config --format json |
            python3 -c '
          import json
          import sys

          config = json.load(sys.stdin)
          worker_networks = config["services"]["worker"]["networks"]
          assert {"backend", "parser", "storage-data", "provider-egress"} <= worker_networks.keys()
          assert config["networks"]["provider-egress"].get("internal") is not True
          assert {
              name
              for name, service in config["services"].items()
              if "provider-egress" in service.get("networks", {})
          } == {"worker"}
          assert set(config["services"]["parser"]["networks"]) == {"parser"}
          '

      - name: Validate deterministic Docker Compose test override
        working-directory: .
        env:
          COMPOSE_DISABLE_ENV_FILE: "1"
          INVESTMENT_RESEARCH_S3_ACCESS_KEY_ID: ci-validation-app-access
          INVESTMENT_RESEARCH_S3_BUCKET: ci-validation-storage
          INVESTMENT_RESEARCH_S3_SECRET_ACCESS_KEY: ci-validation-app-secret
          POSTGRES_DB: investment_research
          POSTGRES_PASSWORD: ci-compose-validation-only
          POSTGRES_PORT: "5432"
          POSTGRES_USER: investment_research
          SEAWEEDFS_ADMIN_ACCESS_KEY: ci-validation-admin-access
          SEAWEEDFS_ADMIN_SECRET_ACCESS_KEY: ci-validation-admin-secret
        run: >-
          docker compose
          --file compose.yaml
          --file compose.test.yaml
          config --quiet

      - name: Build and verify backend images
        run: uv run --locked python -m scripts.verify_backend_images

  object-storage:
    name: Object storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify isolated SeaweedFS object storage
        run: uv run --locked python -m scripts.verify_object_storage

  processing-runtime:
    name: Complete M0 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROGRESS: quiet
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify parser isolation
        run: uv run --locked python -m scripts.verify_parser_isolation

      - name: Verify lost outbox publication and worker recovery
        run: uv run --locked python -m scripts.verify_queue_recovery

      - name: Verify complete automatic M0 fixture journey
        run: uv run --locked python -m scripts.verify_m0_runtime

      - name: Confirm M0 verification resources were removed
        if: ${{ always() }}
        run: python3 -m scripts.verify_runtime_cleanup

  m1-runtime:
    name: Complete M1 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROGRESS: quiet
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          install: false
          cache: false
          require-lockfile: true

      - name: Install frontend dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install Chromium for visible journey
        working-directory: .
        run: pnpm --filter @investment-research/frontend exec playwright install --with-deps chromium

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify complete automatic M1 PDF and text journey
        run: uv run --locked python -m scripts.verify_m1_runtime

      - name: Confirm M1 verification resources were removed
        if: ${{ always() }}
        run: python3 -m scripts.verify_runtime_cleanup
