name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          install: false
          cache: false
          require-lockfile: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INVESTMENT_RESEARCH_DATABASE_URL: postgresql+psycopg://investment_research:ci-postgres-password@127.0.0.1:5432/investment_research
      INVESTMENT_RESEARCH_ENVIRONMENT: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: investment_research
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_USER: investment_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U investment_research -d investment_research"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify deterministic backend checks
        run: uv run --locked python -m scripts.verify_backend

      - name: Check FastAPI OpenAPI contract
        run: uv run --locked python -m scripts.export_openapi --check

      - name: Migrate empty database to Alembic head
        run: uv run --locked alembic -c alembic.ini upgrade head

      - name: Seed deterministic M0.0 workspaces
        run: uv run --locked python -m scripts.seed_m0_0

      - name: Run PostgreSQL integration tests
        run: uv run --locked pytest -q tests/integration

      - name: Check SQLAlchemy metadata against migration head
        run: uv run --locked alembic -c alembic.ini check

      - name: Downgrade database to base
        run: uv run --locked alembic -c alembic.ini downgrade base

      - name: Upgrade database back to head
        run: uv run --locked alembic -c alembic.ini upgrade head

      - name: Recheck metadata after migration cycle
        run: uv run --locked alembic -c alembic.ini check

  backend-images:
    name: Backend images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Check backend Dockerfile
        run: docker buildx build --check --file Dockerfile .

      - name: Validate Docker Compose configuration
        working-directory: .
        env:
          COMPOSE_DISABLE_ENV_FILE: "1"
          INVESTMENT_RESEARCH_S3_ACCESS_KEY_ID: ci-validation-app-access
          INVESTMENT_RESEARCH_S3_BUCKET: ci-validation-storage
          INVESTMENT_RESEARCH_S3_SECRET_ACCESS_KEY: ci-validation-app-secret
          POSTGRES_DB: investment_research
          POSTGRES_PASSWORD: ci-compose-validation-only
          POSTGRES_PORT: "5432"
          POSTGRES_USER: investment_research
          SEAWEEDFS_ADMIN_ACCESS_KEY: ci-validation-admin-access
          SEAWEEDFS_ADMIN_SECRET_ACCESS_KEY: ci-validation-admin-secret
        run: docker compose --file compose.yaml config --quiet

      - name: Build and verify backend images
        run: uv run --locked python -m scripts.verify_backend_images

  object-storage:
    name: Object storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify isolated SeaweedFS object storage
        run: uv run --locked python -m scripts.verify_object_storage

  processing-runtime:
    name: Processing runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROGRESS: quiet
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/pyproject.toml
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify parser isolation
        run: uv run --locked python -m scripts.verify_parser_isolation

      - name: Verify queue recovery after worker loss
        run: uv run --locked python -m scripts.verify_queue_recovery

      - name: Verify complete automatic M0 fixture journey
        run: uv run --locked python -m scripts.verify_m0_runtime
