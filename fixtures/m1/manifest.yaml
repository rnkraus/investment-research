acceptance_cases:
  - id: question:fy2025-revenue
    kind: answerable_lexical
    question: What was Northstar Grid Analytics' FY2025 revenue, and how did it change from FY2024?
    expected:
      coverage: complete
      answer_status: answered
      required_retrieval_origins:
        - LEXICAL
      statements:
        - text: Northstar Grid Analytics reported FY2025 revenue of $184.2 million, up 22.0% from $151.0 million in FY2024.
          supported_by:
            - passage:fy2025-revenue-comparison

  - id: question:fy2026-rollout-constraint
    kind: answerable_semantic
    question: What is mainly holding back Northstar's rollout to new clients?
    expected:
      coverage: complete
      answer_status: answered
      required_retrieval_origins:
        - DENSE
      statements:
        - text: Northstar identified a shortage of high-voltage transformers as the primary constraint on new customer deployments.
          supported_by:
            - passage:fy2026-transformer-constraint

  - id: question:fy2026-dividend
    kind: unanswerable
    question: What dividend did Northstar Grid Analytics declare for FY2026?
    expected:
      coverage: insufficient
      answer_status: insufficient_evidence
      statements: []
      citations: []
      missing_information: The fixture set provides no dividend amount or declaration for FY2026.

external_provider_policy:
  allowed_data_classification: public_synthetic
  explicit_opt_in_required: true
  normal_ci_network_access: forbidden
  normal_ci_provider_spend_usd: "0.00"
  allowed_transfers:
    openai:
      - bounded question text
      - bounded canonical candidate text
      - strict answer and support-evaluation schemas
    pinecone:
      - deterministic vector identifiers
      - numeric vectors
      - safe identifiers and configuration-version metadata
  forbidden_transfers:
    - credentials
    - private or user archive content
    - filenames
    - raw text in Pinecone metadata
    - prompts, source text, or model output in logs and traces

live_smoke_budget:
  currency: USD
  maximum_total_spend_per_run: "0.10"
  maximum_runs_per_invocation: 1
  maximum_embedding_input_tokens: 5000
  maximum_generation_and_evaluation_input_tokens: 12000
  maximum_generation_and_evaluation_output_tokens: 3000
  maximum_embedding_requests: 4
  maximum_generation_requests: 2
  maximum_support_evaluation_requests: 2
  maximum_pinecone_vectors: 64
  maximum_pinecone_queries: 4
  pinecone_required_plan: Starter
  pinecone_maximum_incremental_spend_usd: "0.00"
  cleanup_required: true
  pricing_review:
    reviewed_at: "2026-09-17"
    openai_terra_input_usd_per_million_tokens: "2.00"
    openai_terra_output_usd_per_million_tokens: "12.00"
    openai_text_embedding_3_small_usd_per_million_tokens: "0.02"
    openai_source: https://developers.openai.com/api/docs/models/gpt-5.6-terra
    pinecone_source: https://www.pinecone.io/pricing/

acceptance_rules:
  - Every fixture file must match its declared byte size and SHA-256 checksum.
  - Every expected passage must match its declared source range, hash, and occurrence count.
  - The lexical case must select validated evidence from the PDF regression fixture.
  - The semantic case must include dense-lane evidence from the pasted-text fixture.
  - The unanswerable case must emit no archive-derived statement or general-knowledge completion.
  - Deterministic CI must require no network, provider credentials, or provider spend.
  - A live smoke run must reject non-allowlisted data, enforce all request and token limits, and clean up its derived Pinecone records.
