services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT for isolated verification}:5432"
    networks:
      - backend
      - host-test

  api:
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: test
      INVESTMENT_RESEARCH_PROCESSING_PROFILE: m0-regression

  worker:
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: test
      INVESTMENT_RESEARCH_PROCESSING_PROFILE: m0-regression

  acceptance:
    image: ${M0_ACCEPTANCE_IMAGE:-investment-research-m0-acceptance:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: verification
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      INVESTMENT_RESEARCH_M0_RUNTIME_ACCEPTANCE: "1"
    networks:
      - frontend
    volumes:
      - type: bind
        source: ${M0_ACCEPTANCE_FIXTURE_PATH:-./fixtures/m0_0/documents/northstar-grid-analytics-fy2025-earnings-brief.pdf}
        target: /verification-fixture.pdf
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

networks:
  host-test:
