name: investment-research-m0-0

x-seaweedfs-service: &seaweedfs-service
  image: investment-research-seaweedfs:4.47
  build:
    context: .
    dockerfile: docker/seaweedfs/Dockerfile
  user: "65532:65532"
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 15s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777

x-backend-runtime: &backend-runtime
  user: "65532:65532"
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 15s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or the shell}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or the shell}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - backend

  migration:
    <<: *backend-runtime
    image: investment-research-backend-migration:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migration
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: development
      INVESTMENT_RESEARCH_RUNTIME_LOCATION: container
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or the shell}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or the shell}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: "no"

  seed:
    <<: *backend-runtime
    profiles:
      - tools
    image: investment-research-backend-seed:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: seed
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: development
      INVESTMENT_RESEARCH_RUNTIME_LOCATION: container
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or the shell}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or the shell}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_PORT: 5432
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: "no"

  redis:
    image: investment-research-redis:8.2.9
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    user: "999:1000"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /usr/local/bin/start-investment-research-redis
    command: []
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    secrets:
      - redis_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /data:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=999,gid=1000
      - /run/redis:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=999,gid=1000
    networks:
      - backend
      - repair
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s

  scheduler:
    <<: *backend-runtime
    image: investment-research-backend-worker:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    entrypoint:
      - /app/.venv/bin/python
      - -m
      - investment_research.scheduler
    command: []
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -m
        - investment_research.scheduler_health
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: development
      INVESTMENT_RESEARCH_RUNTIME_LOCATION: container
      INVESTMENT_RESEARCH_LOG_LEVEL: INFO
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - redis_password
    networks:
      - repair
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  parser:
    <<: *backend-runtime
    image: investment-research-backend-parser:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: parser
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: development
      INVESTMENT_RESEARCH_RUNTIME_LOCATION: container
      INVESTMENT_RESEARCH_LOG_LEVEL: ${INVESTMENT_RESEARCH_LOG_LEVEL:-INFO}
      INVESTMENT_RESEARCH_PARSER_HOST: 0.0.0.0
      INVESTMENT_RESEARCH_PARSER_PORT: 8100
      INVESTMENT_RESEARCH_MAX_UPLOAD_BYTES: ${INVESTMENT_RESEARCH_MAX_UPLOAD_BYTES:-26214400}
      INVESTMENT_RESEARCH_MAX_PDF_PAGES: ${INVESTMENT_RESEARCH_MAX_PDF_PAGES:-250}
      INVESTMENT_RESEARCH_MAX_EXTRACTED_CHARACTERS: ${INVESTMENT_RESEARCH_MAX_EXTRACTED_CHARACTERS:-2000000}
      INVESTMENT_RESEARCH_PARSER_CHILD_TIMEOUT_SECONDS: ${INVESTMENT_RESEARCH_PARSER_CHILD_TIMEOUT_SECONDS:-20}
      INVESTMENT_RESEARCH_PARSER_MAX_CONCURRENT_CHILDREN: ${INVESTMENT_RESEARCH_PARSER_MAX_CONCURRENT_CHILDREN:-2}
    networks:
      - parser
    mem_limit: 640m
    cpus: 1.0
    pids_limit: 64

  api:
    <<: *backend-runtime
    image: investment-research-backend-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: development
      INVESTMENT_RESEARCH_RUNTIME_LOCATION: container
      INVESTMENT_RESEARCH_LOG_LEVEL: ${INVESTMENT_RESEARCH_LOG_LEVEL:-INFO}
      INVESTMENT_RESEARCH_API_HOST: 0.0.0.0
      INVESTMENT_RESEARCH_API_PORT: 8000
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or the shell}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or the shell}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_PORT: 5432
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: 6379
      INVESTMENT_RESEARCH_OBJECT_STORAGE_PROVIDER: s3
      INVESTMENT_RESEARCH_S3_ENDPOINT_URL: http://seaweedfs-s3:8333
      INVESTMENT_RESEARCH_S3_REGION_NAME: ${INVESTMENT_RESEARCH_S3_REGION_NAME:-us-east-1}
      INVESTMENT_RESEARCH_S3_BUCKET: ${INVESTMENT_RESEARCH_S3_BUCKET:?Set INVESTMENT_RESEARCH_S3_BUCKET in .env or the shell}
      INVESTMENT_RESEARCH_S3_ACCESS_KEY_ID_FILE: /run/secrets/seaweedfs_application_access_key
      INVESTMENT_RESEARCH_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/seaweedfs_application_secret_access_key
      INVESTMENT_RESEARCH_MAX_UPLOAD_BYTES: ${INVESTMENT_RESEARCH_MAX_UPLOAD_BYTES:-26214400}
    ports:
      - "127.0.0.1:${INVESTMENT_RESEARCH_API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./config/rag.toml
        target: /config/rag.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      scheduler:
        condition: service_started
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-bootstrap:
        condition: service_completed_successfully
    secrets:
      - postgres_password
      - redis_password
      - seaweedfs_application_access_key
      - seaweedfs_application_secret_access_key
    networks:
      - frontend
      - backend
      - storage-data
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64

  web:
    image: investment-research-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    user: "65532:65532"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${INVESTMENT_RESEARCH_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks:
      - frontend
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    <<: *backend-runtime
    image: investment-research-backend-worker:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    environment:
      INVESTMENT_RESEARCH_ENVIRONMENT: development
      INVESTMENT_RESEARCH_RUNTIME_LOCATION: container
      INVESTMENT_RESEARCH_LOG_LEVEL: ${INVESTMENT_RESEARCH_LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or the shell}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or the shell}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_PORT: 5432
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: 6379
      INVESTMENT_RESEARCH_OBJECT_STORAGE_PROVIDER: s3
      INVESTMENT_RESEARCH_S3_ENDPOINT_URL: http://seaweedfs-s3:8333
      INVESTMENT_RESEARCH_S3_REGION_NAME: ${INVESTMENT_RESEARCH_S3_REGION_NAME:-us-east-1}
      INVESTMENT_RESEARCH_S3_BUCKET: ${INVESTMENT_RESEARCH_S3_BUCKET:?Set INVESTMENT_RESEARCH_S3_BUCKET in .env or the shell}
      INVESTMENT_RESEARCH_S3_ACCESS_KEY_ID_FILE: /run/secrets/seaweedfs_application_access_key
      INVESTMENT_RESEARCH_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/seaweedfs_application_secret_access_key
      INVESTMENT_RESEARCH_PARSER_ENDPOINT_URL: http://parser:8100
      INVESTMENT_RESEARCH_MAX_UPLOAD_BYTES: ${INVESTMENT_RESEARCH_MAX_UPLOAD_BYTES:-26214400}
      INVESTMENT_RESEARCH_MAX_PDF_PAGES: ${INVESTMENT_RESEARCH_MAX_PDF_PAGES:-250}
      INVESTMENT_RESEARCH_MAX_EXTRACTED_CHARACTERS: ${INVESTMENT_RESEARCH_MAX_EXTRACTED_CHARACTERS:-2000000}
      INVESTMENT_RESEARCH_PROCESSING_TIMEOUT_SECONDS: ${INVESTMENT_RESEARCH_PROCESSING_TIMEOUT_SECONDS:-30}
    depends_on:
      migration:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-bootstrap:
        condition: service_completed_successfully
    secrets:
      - postgres_password
      - redis_password
      - seaweedfs_application_access_key
      - seaweedfs_application_secret_access_key
    networks:
      - backend
      - storage-data
      - parser
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128

  seaweedfs-master:
    <<: *seaweedfs-service
    command:
      - master
      - -ip=seaweedfs-master
      - -ip.bind=0.0.0.0
      - -port=9333
      - -mdir=/data/master
      - -peers=none
      - -telemetry=false
      - -volumeSizeLimitMB=1024
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - seaweedfs-master-data:/data
    networks:
      - storage-control

  seaweedfs-volume:
    <<: *seaweedfs-service
    command:
      - volume
      - -master=seaweedfs-master:9333
      - -ip=seaweedfs-volume
      - -ip.bind=0.0.0.0
      - -port=8080
      - -dir=/data/volume
      - -dir.idx=/data/volume
      - -index=leveldb
      - -max=10
      - -fileSizeLimitMB=100
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - seaweedfs-volume-data:/data
    networks:
      - storage-control

  seaweedfs-filer:
    <<: *seaweedfs-service
    command:
      - filer
      - -master=seaweedfs-master:9333
      - -ip=seaweedfs-filer
      - -ip.bind=0.0.0.0
      - -port=8888
      - -defaultStoreDir=/data/filer
      - -disableDirListing=true
      - -exposeDirectoryData=false
      - -allowedOrigins=
      - -iam=false
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - seaweedfs-filer-data:/data
    networks:
      - storage-control

  seaweedfs-s3:
    <<: *seaweedfs-service
    read_only: false
    entrypoint:
      - /usr/local/bin/start-seaweedfs-s3
    command: []
    environment:
      INVESTMENT_RESEARCH_S3_BUCKET: ${INVESTMENT_RESEARCH_S3_BUCKET:?Set INVESTMENT_RESEARCH_S3_BUCKET in .env or the shell}
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    secrets:
      - seaweedfs_admin_access_key
      - seaweedfs_admin_secret_access_key
      - seaweedfs_application_access_key
      - seaweedfs_application_secret_access_key
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /run/seaweedfs:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=65532,gid=65532
    networks:
      - storage-control
      - storage-data

  seaweedfs-bootstrap:
    image: investment-research-backend-storage-bootstrap:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    user: "65532:65532"
    init: true
    read_only: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /app/.venv/bin/python
      - -m
      - investment_research.infrastructure.object_storage.seaweedfs_bootstrap
    command: []
    environment:
      INVESTMENT_RESEARCH_S3_ENDPOINT_URL: http://seaweedfs-s3:8333
      INVESTMENT_RESEARCH_S3_REGION_NAME: ${INVESTMENT_RESEARCH_S3_REGION_NAME:-us-east-1}
      INVESTMENT_RESEARCH_S3_BUCKET: ${INVESTMENT_RESEARCH_S3_BUCKET:?Set INVESTMENT_RESEARCH_S3_BUCKET in .env or the shell}
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    secrets:
      - seaweedfs_admin_access_key
      - seaweedfs_admin_secret_access_key
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks:
      - storage-data
    restart: "no"

volumes:
  postgres-data:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  seaweedfs-filer-data:

networks:
  frontend:
  repair:
    internal: true
  backend:
    internal: true
  parser:
    internal: true
  storage-control:
    internal: true
  storage-data:
    internal: true

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-.secrets/postgres_password}
  redis_password:
    file: ${REDIS_PASSWORD_SECRET_FILE:-.secrets/redis_password}
  seaweedfs_admin_access_key:
    file: ${SEAWEEDFS_ADMIN_ACCESS_KEY_SECRET_FILE:-.secrets/seaweedfs_admin_access_key}
  seaweedfs_admin_secret_access_key:
    file: ${SEAWEEDFS_ADMIN_SECRET_ACCESS_KEY_SECRET_FILE:-.secrets/seaweedfs_admin_secret_access_key}
  seaweedfs_application_access_key:
    file: ${INVESTMENT_RESEARCH_S3_ACCESS_KEY_ID_SECRET_FILE:-.secrets/seaweedfs_application_access_key}
  seaweedfs_application_secret_access_key:
    file: ${INVESTMENT_RESEARCH_S3_SECRET_ACCESS_KEY_SECRET_FILE:-.secrets/seaweedfs_application_secret_access_key}
